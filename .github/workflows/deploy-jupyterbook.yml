name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pemrosesan-data-sains/requirements.txt

      - name: Build Jupyter Book
        run: |
          jupyter-book build --all pemrosesan-data-sains

      - name: Prepare website files
        run: |
          set -euxo pipefail
          mkdir -p pages-site
          cp -R pemrosesan-data-sains/_build/html/. pages-site/
          mkdir -p pages-site/static_pages
          cp pemrosesan-data-sains/static_pages/laporan-clustering.html pages-site/static_pages/
          cp pemrosesan-data-sains/static_pages/peta_100_sampel.html pages-site/static_pages/
          test -s pages-site/index.html
          test -s pages-site/static_pages/laporan-clustering.html
          test -s pages-site/static_pages/peta_100_sampel.html

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-site
