name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pemrosesan-data-sains/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pemrosesan-data-sains/requirements.txt

      - name: Build Jupyter Book
        run: |
          set -euxo pipefail
          jupyter-book build --all --path-output pages-site pemrosesan-data-sains
          test -s pages-site/_build/html/index.html
          test -s pages-site/_build/html/laporan-clustering.html
          test -s pages-site/_build/html/peta_100_sampel.html

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-site/_build/html
